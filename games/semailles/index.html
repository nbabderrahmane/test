<script>
/*ENGINE:BEGIN (pure rules + adversaries, no DOM; tools/semailles loads this block)*/
var WIN = 25, PLY_CAP = 200, INF = 100000;
// Board: Int8Array(14). Pits 0..5 = the player's row (left to right), 6..11 = the adversary's row
// (sowing is counter-clockwise: the index grows, 11 is followed by 0). 12, 13 = captured seeds.
function mkBoard(pits, st) {
  var b = new Int8Array(14), i;
  for (i = 0; i < 12; i++) b[i] = pits[i];
  b[12] = st[0]; b[13] = st[1];
  return b;
}
function sideSum(b, t) {
  var s = 0, o = t * 6;
  for (var i = 0; i < 6; i++) s += b[o + i];
  return s;
}
// Does sowing this pit drop at least one seed on the other side?
function feeds(b, t, pit) {
  var n = b[pit], o = (1 - t) * 6, pos = pit;
  while (n > 0) {
    pos = (pos + 1) % 12;
    if (pos === pit) continue;
    if (pos >= o && pos < o + 6) return true;
    n--;
  }
  return false;
}
// Legal pits of player t: seeds in the pit, and when the opponent has nothing, a move that feeds him.
function moves(b, t) {
  var out = [], o = t * 6, starving = sideSum(b, 1 - t) === 0;
  for (var i = o; i < o + 6; i++) {
    if (b[i] > 0 && (!starving || feeds(b, t, i))) out.push(i);
  }
  return out;
}
// Plays a pit for player t on a copy. caps = [[pit, seeds], ...]; grand = a capture of every
// opponent seed was cancelled (the move is legal, it captures nothing).
function play(b, t, pit) {
  var nb = b.slice(), n = nb[pit], pos = pit, path = [], o = (1 - t) * 6, caps = [], gain = 0, q, i;
  nb[pit] = 0;
  while (n > 0) {
    pos = (pos + 1) % 12;
    if (pos === pit) continue;   // a pit of 12 seeds or more is skipped
    nb[pos]++; n--; path.push(pos);
  }
  if (pos >= o && pos < o + 6) {
    q = pos;
    while (q >= o && (nb[q] === 2 || nb[q] === 3)) { caps.push([q, nb[q]]); gain += nb[q]; q--; }
  }
  var grand = false;
  if (gain > 0 && gain === sideSum(nb, 1 - t)) { grand = true; caps = []; gain = 0; }
  for (i = 0; i < caps.length; i++) nb[caps[i][0]] = 0;
  nb[12 + t] += gain;
  return { b: nb, path: path, caps: caps, gain: gain, grand: grand, last: pos };
}
// State of the game once player t is the next to move after `plies` moves: null while it goes on,
// else {b, winner (0, 1 or -1 for a draw), why}. Remaining seeds go to the owner of their side.
function status(b, t, plies) {
  var why = '';
  if (b[12] >= WIN) return { b: b, winner: 0, why: 'win' };
  if (b[13] >= WIN) return { b: b, winner: 1, why: 'win' };
  if (plies >= PLY_CAP) why = 'cap';
  else if (moves(b, t).length === 0) why = 'stuck';
  else return null;
  var nb = b.slice();
  nb[12] += sideSum(b, 0); nb[13] += sideSum(b, 1);
  for (var i = 0; i < 12; i++) nb[i] = 0;
  return { b: nb, winner: nb[12] > nb[13] ? 0 : nb[13] > nb[12] ? 1 : -1, why: why };
}
function evalB(b, t) {
  var u = 1 - t, v = 0, i, a, c;
  for (i = 0; i < 6; i++) {
    a = b[t * 6 + i]; c = b[u * 6 + i];
    if (a === 1 || a === 2) v -= 2;
    if (c === 1 || c === 2) v += 2;
  }
  return (b[12 + t] - b[12 + u]) * 12 + sideSum(b, t) - sideSum(b, u) + v;
}
function negamax(b, t, plies, depth, alpha, beta, cx) {
  if (++cx.nodes > cx.max) { cx.abort = true; return 0; }
  var st = status(b, t, plies);
  if (st) {
    var d = st.b[12 + t] - st.b[13 - t];
    return st.winner === t ? INF - plies + d : st.winner === -1 ? 0 : -INF + plies + d;
  }
  if (depth === 0) return evalB(b, t);
  var mv = moves(b, t), rs = [], i, best = -INF * 2, v;
  for (i = 0; i < mv.length; i++) rs.push(play(b, t, mv[i]));
  rs.sort(function (x, y) { return y.gain - x.gain; });
  for (i = 0; i < rs.length; i++) {
    v = -negamax(rs[i].b, 1 - t, plies + 1, depth - 1, -beta, -alpha, cx);
    if (cx.abort) return 0;
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best;
}
// Best moves (all those that tie) by iterative deepening, bounded by depth and by a node budget.
// Deterministic: the budget counts nodes, never time.
function bestMoves(b, t, plies, maxDepth, maxNodes) {
  var mv = moves(b, t), keep = mv, cx = { nodes: 0, max: maxNodes, abort: false }, d, i, vals, best, v, res;
  if (mv.length < 2) return { moves: mv, nodes: 0, depth: 0 };
  res = mv.map(function (m) { return { m: m, r: play(b, t, m) }; });
  res.sort(function (x, y) { return y.r.gain - x.r.gain; });
  mv = res.map(function (x) { return x.m; });
  keep = mv.slice();
  var done = 0;
  for (d = 1; d <= maxDepth; d++) {
    vals = []; best = -INF * 2;
    for (i = 0; i < res.length; i++) {
      v = -negamax(res[i].r.b, 1 - t, plies + 1, d - 1, -INF * 2, -(best - 1), cx);
      if (cx.abort) break;
      vals.push(v);
      if (v > best) best = v;
    }
    if (cx.abort) break;
    keep = [];
    for (i = 0; i < res.length; i++) if (vals[i] === best) keep.push(res[i].m);
    done = d;
  }
  return { moves: keep, nodes: cx.nodes, depth: done };
}
// Seeded generator (mulberry32). rng.s is the whole state, so a game can be resumed exactly.
function mkRng(seed) {
  var rng = function () {
    rng.s = (rng.s + 0x6D2B79F5) | 0;
    var t = Math.imul(rng.s ^ (rng.s >>> 15), 1 | rng.s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.s = seed | 0;
  return rng;
}
// The adversary of a level: r = chance of a random move, d = search depth, n = node budget.
function aiMove(b, t, plies, P, rng) {
  var mv = moves(b, t), r;
  if (mv.length === 1) return mv[0];
  if (P.r && rng() < P.r) return mv[Math.floor(rng() * mv.length)];
  r = bestMoves(b, t, plies, P.d, P.n);
  return r.moves[Math.floor(rng() * r.moves.length)];
}

var S4 = [4,4,4,4,4,4,4,4,4,4,4,4];
// 20 adversaries, weakest first. start = {p: 12 pits, s: seeds already captured, note}; the player moves first.
var LEVELS = [
  { nm: 'Pépin',     ai: { r: 1, d: 1, n: 100 }, p: [4,4,3,3,2,2, 1,2,1,2,2,2], s: [16,0], note: 'Départ avancé' },
  { nm: 'Moineau',   ai: { r: 0.6, d: 1, n: 100 }, p: [4,4,4,3,2,2, 1,2,1,2,2,2], s: [14,0], note: 'Départ avancé' },
  { nm: 'Fourmi',    ai: { r: 0.3, d: 1, n: 100 }, p: S4, s: [0,0] },
  { nm: 'Tourterelle', ai: { r: 0.1, d: 1, n: 100 }, p: S4, s: [0,0] },
  { nm: 'Criquet',   ai: { r: 0, d: 1, n: 100 }, p: S4, s: [0,0] },
  { nm: 'Hérisson',  ai: { r: 0.15, d: 2, n: 500 }, p: [4,4,4,4,4,4, 3,3,3,3,3,4], s: [5,0], note: 'Départ avancé' },
  { nm: 'Écureuil',  ai: { r: 0, d: 2, n: 500 }, p: S4, s: [0,0] },
  { nm: 'Pintade',   ai: { r: 0.1, d: 3, n: 1000 }, p: S4, s: [0,0] },
  { nm: 'Chacal',    ai: { r: 0, d: 3, n: 1000 }, p: S4, s: [0,0] },
  { nm: 'Mangouste', ai: { r: 0.1, d: 4, n: 2000 }, p: S4, s: [0,0] },
  { nm: 'Varan',     ai: { r: 0, d: 4, n: 2000 }, p: [0,6,6,6,6,0, 0,6,6,6,6,0], s: [0,0], note: 'Quatre gros tas' },
  { nm: 'Buffle',    ai: { r: 0.08, d: 5, n: 3000 }, p: S4, s: [0,0] },
  { nm: 'Hyène',     ai: { r: 0, d: 5, n: 3000 }, p: S4, s: [0,0] },
  { nm: 'Guépard',   ai: { r: 0.05, d: 6, n: 4000 }, p: S4, s: [0,0] },

  { nm: 'Babouin',   ai: { r: 0, d: 6, n: 6000 }, p: S4, s: [0,0] },

  { nm: 'Griot',     ai: { r: 0, d: 8, n: 14000 }, p: S4, s: [0,0] },
  { nm: 'Le Sage',   ai: { r: 0, d: 8, n: 20000 }, p: S4, s: [0,0] }
];
