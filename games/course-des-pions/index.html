<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131A2E">
<title>Ronde Vive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#131A2E;--panel:#1D2742;--line:#4A5880;--ink:#F4F1E8;--dim:#A9B4D0;--gold:#FFC53D;--off:#3A4567;
  --acc:#FF7A59;--acc-ink:#2B0D03;
  --c0:#FF7A59;--c1:#2CC5D2;--c2:#A98BFF;--c3:#C6E34B;
  --i0:#2B0D03;--i1:#032E33;--i2:#1E0F52;--i3:#2A3300;
  --c:44px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;color:var(--ink);
  font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
svg{display:block}

#app{
  position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:8px;padding:6px 12px 2px;flex:none}
.icon{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px;fill:var(--ink)}
.icon svg.st{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.icon small{font-size:11px;font-weight:800;line-height:1;margin-top:1px}
.icon.on{background:var(--acc);color:var(--acc-ink)}
.icon.on svg{fill:var(--acc-ink)}
.ttl{flex:1;min-width:0;text-align:center}
#lvl{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--dim);white-space:nowrap;margin-top:2px;min-height:16px}
#goal svg{width:12px;height:12px;fill:var(--gold)}
#goal span{margin-left:4px;overflow:hidden;text-overflow:ellipsis}
#goal.chal{color:var(--gold);font-weight:700}

#bwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 4px}
#board{position:relative;width:300px;height:300px;border-radius:18px;background:#1A2340;flex:none}
.t{position:absolute;width:var(--c);height:var(--c);padding:2px}
.t i{display:block;width:100%;height:100%;border-radius:22%;background:#28345F}
.t u{position:absolute;left:27%;top:27%;width:46%;height:46%;border:2px solid #7886B8;border-radius:50%}
.t svg.sy{position:absolute;left:24%;top:24%;width:52%;height:52%}
.t svg.ar{position:absolute;left:20%;top:20%;width:60%;height:60%;fill:none;stroke:#566594;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.t.l0 i{background:rgba(255,122,89,.24)}.t.l1 i{background:rgba(44,197,210,.24)}
.t.l2 i{background:rgba(169,139,255,.26)}.t.l3 i{background:rgba(198,227,75,.22)}
.t.e0 i{background:rgba(255,122,89,.42)}.t.e1 i{background:rgba(44,197,210,.42)}
.t.e2 i{background:rgba(169,139,255,.44)}.t.e3 i{background:rgba(198,227,75,.38)}
.t.l0 svg.sy,.t.e0 svg.sy{fill:var(--c0)}.t.l1 svg.sy,.t.e1 svg.sy{fill:var(--c1)}
.t.l2 svg.sy,.t.e2 svg.sy{fill:var(--c2)}.t.l3 svg.sy,.t.e3 svg.sy{fill:var(--c3)}
.t.l0 svg.sy,.t.l1 svg.sy,.t.l2 svg.sy,.t.l3 svg.sy{opacity:.55}
.t.e0 u{border-color:var(--c0)}.t.e1 u{border-color:var(--c1)}.t.e2 u{border-color:var(--c2)}.t.e3 u{border-color:var(--c3)}
.t.e0 svg.sy,.t.e1 svg.sy,.t.e2 svg.sy,.t.e3 svg.sy{left:34%;top:34%;width:32%;height:32%}
.t.ctr i{border-radius:50%;background:#33406E}
.t.ctr svg.sy{left:22%;top:20%;width:56%;height:56%;fill:var(--ink);opacity:.85}
.bp{position:absolute;width:calc(var(--c)*2);height:calc(var(--c)*2)}
.bp:before{content:"";position:absolute;left:3px;top:3px;right:3px;bottom:3px;border-radius:16px}
.bp.s0:before{background:rgba(255,122,89,.16);box-shadow:inset 0 0 0 2px rgba(255,122,89,.55)}
.bp.s1:before{background:rgba(44,197,210,.16);box-shadow:inset 0 0 0 2px rgba(44,197,210,.55)}
.bp.s2:before{background:rgba(169,139,255,.18);box-shadow:inset 0 0 0 2px rgba(169,139,255,.6)}
.bp.s3:before{background:rgba(198,227,75,.14);box-shadow:inset 0 0 0 2px rgba(198,227,75,.5)}
.sl{position:absolute;width:var(--c);height:var(--c)}
.sl:before{content:"";position:absolute;left:21%;top:21%;width:58%;height:58%;border-radius:50%;border:2px dashed rgba(244,241,232,.3)}
.sl.ok:before{border:0;background:rgba(244,241,232,.9)}
.sl.ok:after{content:"";position:absolute;left:38%;top:30%;width:22%;height:38%;border:solid #131A2E;border-width:0 3px 3px 0;transform:rotate(40deg)}
.bp.sx:before{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 2px rgba(255,255,255,.09)}
.bp.sx .sl{display:none}
.t.lx i{background:#202A4B}

.pion{
  position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:2;will-change:transform;
}
.pion .d{position:relative;left:var(--dx,0);top:var(--dy,0);width:var(--d,32px);height:var(--d,32px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px #131A2E,inset 0 -3px 0 rgba(0,0,0,.2)}
.pion svg{width:62%;height:62%;fill:currentColor}
.pion.p0 .d{background:var(--c0);color:var(--i0)}.pion.p1 .d{background:var(--c1);color:var(--i1)}
.pion.p2 .d{background:var(--c2);color:var(--i2)}.pion.p3 .d{background:var(--c3);color:var(--i3)}
.pion.go{pointer-events:auto;z-index:6;cursor:pointer}
.pion.go .d{box-shadow:0 0 0 3px var(--ink),0 0 0 5px #131A2E;animation:bob .7s ease-in-out infinite alternate}
.pion.fin{opacity:0;visibility:hidden;transition:opacity .2s .3s,visibility 0s .5s}
.dest{position:absolute;left:0;top:0;width:var(--c);height:var(--c);pointer-events:none;z-index:1}
.dest:before{content:"";position:absolute;left:14%;top:14%;width:72%;height:72%;border-radius:50%;border:3px dashed var(--ink);opacity:.9}
@keyframes bob{to{transform:scale(1.12)}}

#dock{flex:none;display:flex;align-items:center;gap:10px;padding:4px 12px 2px;min-height:76px}
#die{width:68px;height:68px;border-radius:18px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 3px var(--line)}
#die svg{width:56px;height:56px}
#die.ready{box-shadow:inset 0 0 0 3px var(--ink);animation:bob .7s ease-in-out infinite alternate}
#die.spin svg{animation:spin .28s ease-out}
#die[disabled]{cursor:default}
@keyframes spin{from{transform:rotate(-200deg) scale(.5);opacity:.3}}
.dt{flex:1;min-width:0}
#who{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;white-space:nowrap}
#who svg{width:20px;height:20px;flex:none;border-radius:50%;padding:3px}
#who span{overflow:hidden;text-overflow:ellipsis}
#msg{font-size:13px;line-height:1.2;font-weight:600;color:var(--dim);margin-top:3px;min-height:32px;overflow:hidden}
#msg.hint{color:var(--ink)}
#msg.warn{color:#FFD9A0}
.tour{width:48px;flex:none;text-align:center;background:var(--panel);border-radius:12px;padding:5px 0 4px}
.tour b{display:block;font-size:19px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.tour small{font-size:10px;color:var(--dim)}
.k0{background:var(--c0);fill:var(--i0)}.k1{background:var(--c1);fill:var(--i1)}.k2{background:var(--c2);fill:var(--i2)}.k3{background:var(--c3);fill:var(--i3)}

footer{flex:none;display:flex;gap:10px;padding:4px 12px 10px}
.btn{
  flex:1;min-height:50px;border-radius:14px;background:var(--panel);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{color:#66739A;cursor:default}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--line)}

.over{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(12,17,32,.92);padding:12px 16px;overflow:hidden;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:330px;background:var(--panel);border-radius:22px;padding:16px 18px 14px;text-align:center;animation:pop .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-size:26px;font-weight:800}
.card p{color:var(--dim);margin-top:4px;font-size:15px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:8px 0 2px}
.stars svg{width:46px;height:46px;fill:var(--off)}
.stars svg:nth-child(2){width:58px;height:58px}
.stars svg.on{fill:var(--gold);animation:star .4s cubic-bezier(.2,1.6,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.14s}
.stars svg.on:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.big{font-size:38px;font-weight:800;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;color:var(--dim);margin-left:6px}
.rank{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.rank span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);border-radius:12px;padding:3px 9px 3px 4px;font-size:13px;font-weight:700}
.rank span.me{box-shadow:inset 0 0 0 2px var(--ink)}
.rank svg{width:20px;height:20px;border-radius:50%;padding:3px}
.card p.cres{margin-top:6px;font-weight:800;font-size:16px;color:var(--acc)}
.card p.cres.lost{color:#FFB4BC}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .row{display:flex;gap:8px}
.acts .btn{min-height:48px}

.scr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
.top{flex:none;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:24px;font-weight:800;color:var(--acc);white-space:nowrap}
.top .sub{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.2}
.total{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;height:44px;padding:0 12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.total svg{width:18px;height:18px;fill:var(--gold)}

#home{justify-content:center;gap:12px}
.hbrand{text-align:center;margin-bottom:2px}
.hbrand h1{font-size:38px;font-weight:800;color:var(--acc);line-height:1.1}
.hbrand .sub{color:var(--dim);font-size:14px;margin-top:4px}
.hpions{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.hpions div{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #131A2E,0 0 0 5px var(--line)}
.hpions svg{width:28px;height:28px}
.stat{background:var(--panel);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:62px}
.stat svg{width:30px;height:30px;fill:var(--gold);flex:none}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
#home .btn{flex:none}
#bGo{min-height:58px;font-size:17px}
.pbar{height:6px;border-radius:3px;background:var(--off);margin-top:6px;overflow:hidden;width:150px}
.pbar u{display:block;height:100%;background:var(--gold);text-decoration:none}

#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.cell{position:relative;min-height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.cell .n{font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell .n svg{width:18px;height:18px;fill:#66739A}
.cell .m{font-size:10px;color:var(--dim);line-height:1}
.cell .s{display:flex;gap:1px}
.cell .s svg{width:14px;height:14px;fill:var(--off)}
.cell .s svg.on{fill:var(--gold)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.ok{background:#1F4A44}
.cell[disabled]{background:#182036;cursor:default}
.cell:not([disabled]):active{transform:scale(.96)}

#hot{justify-content:flex-start}
#hotl{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
#hotl .btn{min-height:64px;font-size:18px;justify-content:flex-start;padding:0 18px;gap:12px}
.pr{display:flex;gap:4px}
.pr i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal}
.pr svg{width:14px;height:14px}

@media (max-height:600px){
  header{padding-top:4px}
  #dock{min-height:72px}
  #die{width:64px;height:64px}
  footer{padding-bottom:8px}
  .btn{min-height:46px}
  .stars svg{width:38px;height:38px}.stars svg:nth-child(2){width:48px;height:48px}
  .card{padding:12px 16px 12px}.card h2{font-size:22px}
  .big{font-size:32px}
  .acts{gap:6px;margin-top:8px}.acts .btn{min-height:46px}
  .hbrand h1{font-size:32px}
  #home{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="bMap" aria-label="Niveaux"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
    <div class="ttl"><span id="lvl">Niveau 1</span><div id="goal"></div></div>
    <button class="icon" id="bFast" aria-label="Accélérer les adversaires" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 5l8 7-8 7zM12 5l8 7-8 7z"/></svg><small id="fastT">×1</small></button>
  </header>
  <div id="bwrap"><div id="board"></div></div>
  <div id="dock">
    <button id="die" aria-label="Lancer le dé"></button>
    <div class="dt"><div id="who"></div><div id="msg" role="status" aria-live="polite"></div></div>
    <div class="tour" aria-label="Tour en cours"><b id="tn">1</b><small>tour</small></div>
  </div>
  <footer>
    <button class="btn" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -3)"/></svg>Annuler</button>
    <button class="btn" id="bReset"><svg viewBox="0 0 24 24"><path d="M4 5v6h6M5 11a8 8 0 1 1 2 7"/></svg>Recommencer</button>
  </footer>

  <section class="over" id="res" hidden aria-live="polite">
    <div class="card">
      <h2 id="wTitle"></h2>
      <p id="wSub"></p>
      <div class="stars" id="wStars"></div>
      <div class="big"><span id="wTurns">0</span><small>tours</small></div>
      <div class="rank" id="wRank"></div>
      <p class="cres" id="wChal" hidden></p>
      <div class="acts" id="acts"></div>
    </div>
  </section>

  <section class="scr" id="home" hidden>
    <div class="hbrand">
      <div class="hpions" id="hpions" aria-hidden="true"></div>
      <h1>Ronde Vive</h1><div class="sub">Fais le tour, rentre tes pions avant les autres.</div>
    </div>
    <div class="stat"><svg viewBox="0 0 24 24"><use href="#star"/></svg><div><b id="hStars">0 / 60</b><small>étoiles</small><div class="pbar"><u id="hBar"></u></div></div></div>
    <button class="btn acc" id="bGo">Continuer</button>
    <button class="btn" id="bLevels">Niveaux</button>
    <button class="btn" id="bHot">À plusieurs sur ce téléphone</button>
  </section>

  <section class="scr" id="levels" hidden>
    <div class="top">
      <button class="icon" id="bLBack" aria-label="Accueil"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>Niveaux</h1><div class="sub">2 pions, puis 3 dès le niveau 11</div></div>
      <div class="total" aria-label="Étoiles gagnées"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="gTotal">0/60</span></div>
    </div>
    <div id="grid"></div>
    <button class="btn acc" id="bBack" style="flex:none">Reprendre</button>
  </section>

  <section class="scr" id="hot" hidden>
    <div class="top">
      <button class="icon" id="bHBack" aria-label="Accueil"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>À plusieurs</h1><div class="sub">Un seul téléphone, chacun son tour</div></div>
    </div>
    <div id="hotl"></div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="star" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>
  <path id="y0" d="M12 4l9 15.500H3z"/>
  <path id="y1" d="M12 2.500l7.500 9.500-7.500 9.500L4.500 12z"/>
  <path id="y2" d="M12 2.500l2.900 6 6.600.9-4.800 4.600 1.200 6.500L12 17.400l-5.900 3.100 1.200-6.500L2.500 9.400l6.600-.9z"/>
  <path id="y3" d="M5 5h14v14H5z"/>
  <path id="hs" d="M3.500 20.500V10.500L12 3.500l8.500 7v10h-6v-6h-5v6z"/>
</defs></svg>

<script>
(function () {
'use strict';

var GAME = 'course-des-pions';
var NAME = 'Ronde Vive';
var KEY = 'mj:' + GAME + ':v1';

/*ENGINE:BEGIN (pure rules, dice and opponents, no DOM: tools/course-des-pions loads this block)*/
var ENGINE = (function () {
  // Path of a pion: -1 base | 0..23 the 24 ring cells, clockwise, from the cell after its gate to the gate
  // | 24, 25 its private lane | 26 home. Home is entered by exact count only.
  var RING = 24, HOME = 26, LAST_RING = 23, GATE = [3, 9, 15, 21];
  var REFUGE = {};
  [0, 4, 6, 10, 12, 16, 18, 22].forEach(function (i) { REFUGE[i] = 1; });   // 4 corners + 4 entry cells
  var SEATS = { 2: [2, 0], 3: [2, 3, 0], 4: [2, 3, 0, 1] };                 // board side of each player, clockwise order
  var STAR3 = 5, STAR2 = 2;     // lead (in cells per pion) over the best opponent for 3 and 2 stars

  // [pions, opponent strengths]; strength 0 plays at random ... 5 plays carefully (see TIERS).
  var LEVELS = [   // h: pions of the player, o: pions of each opponent, opp: strength of each opponent
    { h: 2, o: 2, opp: [0] }, { h: 2, o: 2, opp: [0] }, { h: 2, o: 2, opp: [1] }, { h: 2, o: 2, opp: [2] }, { h: 2, o: 2, opp: [3] },

  if (t) tapPion(+t.getAttribute('data-p'), +t.getAttribute('data-i'));
});
board.addEventListener('click', function (e) {
  var t = closestAttr(e.target, 'data-p');
  if (t && !stray()) tapPion(+t.getAttribute('data-p'), +t.getAttribute('data-i'));
});
onTap($('grid'), function (e) { var c = closestAttr(e.target, 'data-level'); if (c && !c.disabled) pickLevel(+c.getAttribute('data-level')); });
onTap($('hotl'), function (e) { var c = closestAttr(e.target, 'data-np'); if (c) { startHot(+c.getAttribute('data-np')); show('game'); } });
onTap($('bUndo'), undo);
onTap($('bReset'), function () { if (G) replay(); });
onTap($('bMap'), openGrid);
onTap($('bFast'), function () { fast = !fast; save.fast = fast; store(); refresh(); });
onTap($('bBack'), goContinue);
onTap($('bLBack'), function () { show('home'); });
onTap($('bHBack'), function () { show('home'); });
onTap($('bGo'), goContinue);
onTap($('bLevels'), function () { show('levels'); });
onTap($('bHot'), function () { show('hot'); });
onTap($('acts'), function (e) {
  var b = closestAttr(e.target, 'data-act');
  if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'next') { if (result.level < N) startLevel(result.level + 1); else show('levels'); }
  else if (a === 'again') replay();
  else if (a === 'menu') show('levels');
  else if (a === 'home') show('home');
  else if (a === 'share') sendText(shareText(), 'result', b);
  else if (a === 'chal') sendText(challengeText(), 'challenge', b);
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
window.addEventListener('resize', function () { if (G) fit(); });
window.addEventListener('hashchange', function () { if (/^#defi-/.test(location.hash)) openChallenge(); });

// ---- boot ------------------------------------------------------------------------------------------------
loadSave();
fast = save.fast;
(function boot() {
  var cg = save.chal;
  if (cg) { screen = 'game'; startChal(cg.level, cg.target, cg); show('game'); }
  else {
    save.chal = null;
    startLevel(save.level, save.cur && save.cur.level === save.level ? save.cur : null);
    show('home');
  }
  if (/^#defi-/.test(location.hash)) openChallenge();
})();

// ---- test hooks (solutions never live here; seeds and the opponent search live in tools/course-des-pions) ------------
window.__game = {
  engine: ENGINE,
  levels: ENGINE.LEVELS.map(function (L, i) { return { n: i + 1, h: L.h, o: L.o, opp: L.opp.slice() }; }),
  state: function () {
    var S = G.S, p = S.turn, mv = S.roll && !S.over ? ENGINE.legal(S, p, S.roll) : [], human = S.tiers[p] === null;
    return {
      mode: G.kind, level: G.level, screen: screen, turn: p, human: human, roll: S.roll, last: S.last, over: S.over, winner: S.winner,
      phase: S.over ? 'over' : S.roll === 0 ? 'roll' : human && mv.length > 1 ? 'pick' : 'moving',
      moves: mv.map(function (m) { return { pion: m.i, from: m.from, to: m.to, cap: m.cap.length }; }),
      game: clone(S), turns: S.turns.slice(), stars: S.over ? ENGINE.starsFor(S) : 0, seed: G.seed, target: G.target,
      fast: fast, canUndo: canUndo(), total: totalStars(), max: save.max, saved: save.level, undoDepth: G.undo.length
    };
  },
  loadLevel: function (n) {
    n = n | 0;
    if (n < 1 || n > N) throw new Error('level must be 1..' + N);
    startLevel(n);
    show('game');
    return this.state();
  },
  seed: function (s) {   // restarts the game in progress with this seed
    var g = newGameFor(G.kind, G.level, { seed: s | 0, np: G.S.np, target: G.target });
    begin(g);
    persist();
    return this.state();
  },
  setGame: function (S) {   // puts a whole position on the board (layout and rule tests)
    var c = cleanState(S, null);
    if (!c) throw new Error('invalid position');
    G.S = c; G.undo = []; drawn = null; gen++; clearTimeout(timer);
    buildBoard(); fit(); persist(); step();
    return this.state();
  },
  startHot: function (np) { startHot(np | 0); show('game'); return this.state(); },
  instant: function (on) {   // no delay, no animation (tests)
    instant = !!on;
    var st = document.getElementById('noanim');
    if (instant && !st) { st = document.createElement('style'); st.id = 'noanim'; st.textContent = '*,*:before,*:after{animation:none!important;transition:none!important}'; document.head.appendChild(st); }
    if (!instant && st) st.parentNode.removeChild(st);
    return instant;
  },
  timing: function () { return { delays: T, fastFactor: 0.4 }; }
};
})();
</script>
</body>
</html>
