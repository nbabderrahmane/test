<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131A2E">
<title>Pile Poil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#131A2E;--panel:#1D2742;--line:#4A5880;--glass:rgba(255,255,255,.05);
  --ink:#F4F1E8;--dim:#A9B4D0;--gold:#FFC53D;--gold-ink:#231A00;--off:#3A4567;--fire:#FF8A3D;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;color:var(--ink);
  font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}

#app{
  position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex:none}
.icon{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px;fill:var(--ink)}
.icon svg.st{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;text-align:center}
.brand{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvl{display:block;font-size:20px;font-weight:800;white-space:nowrap}
.moves{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.moves b{font-size:19px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.moves small{font-size:10px;color:var(--dim);margin-top:2px}

#chal{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:26px;margin:0 12px;border-radius:13px;background:rgba(255,197,61,.14);color:var(--gold);font-size:13px;font-weight:700}
#chal svg{width:14px;height:14px;fill:var(--gold)}
#goal{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:24px;font-size:13px;color:var(--dim)}
#goal svg{width:14px;height:14px;fill:var(--gold)}

#board{flex:1;min-height:0;position:relative;margin:0 8px;overflow:hidden}
#stage{position:absolute}
.tube{position:absolute;display:block;border-radius:12px}
.tube i{
  position:absolute;left:0;right:0;bottom:0;border:2px solid var(--line);border-top:0;background:var(--glass);
  transition:border-color .2s,background-color .2s;
}
.tube i:before,.tube i:after{content:"";position:absolute;top:0;width:6px;height:2px;background:var(--line);transition:background-color .2s}
.tube i:before{left:-6px;border-radius:2px 0 0 2px}
.tube i:after{right:-6px;border-radius:0 2px 2px 0}
.tube.short i{border-style:dashed;border-top:0}
.tube.sel i{border-color:var(--ink);background:rgba(255,255,255,.1)}
.tube.sel i:before,.tube.sel i:after{background:var(--ink)}
.tube.done i{border-color:var(--gold);background:rgba(255,197,61,.1)}
.tube.done i:before,.tube.done i:after{background:var(--gold)}
.tube.no{animation:no .28s}
@keyframes no{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.ball{
  position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;will-change:transform;
  transition:transform .13s ease-out,background-color .2s;display:flex;align-items:center;justify-content:center;
}
.ball svg{width:58%;height:58%}
.ball:after{content:"";position:absolute;left:16%;top:10%;width:34%;height:22%;border-radius:50%;background:rgba(255,255,255,.28);transform:rotate(-28deg)}
.ball.hid{background:#2B3558;box-shadow:inset 0 0 0 2px #46537F}
.ball.hid:after{background:rgba(255,255,255,.1)}
.ball.rev svg{animation:rev .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes rev{from{transform:scale(.2) rotate(-60deg);opacity:0}}
.still .ball{transition:none}

#hand{position:absolute;left:0;top:0;width:44px;height:44px;pointer-events:none;transition:transform .25s}
#hand svg{width:44px;height:44px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(8px)}50%{transform:translateY(-4px) scale(.94)}}

#msg{
  flex:none;height:44px;margin:0 12px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:13px;line-height:1.15;font-weight:600;color:var(--dim);border-radius:12px;padding:3px 10px;overflow:hidden;
}
#msg.warn{color:#FFD9A0}
#msg.hint{color:var(--ink)}
#msg.stuck{background:#4A2530;color:#FFE1E4}
footer{flex:none;display:flex;gap:10px;padding:6px 12px 12px}
.btn{
  flex:1;min-height:50px;border-radius:14px;background:var(--panel);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{color:#66739A;cursor:default}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.btn.need{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}

.over{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(12,17,32,.9);padding:12px 16px;overflow:hidden;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:330px;background:var(--panel);border-radius:22px;padding:18px 18px 14px;text-align:center;animation:pop .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-size:26px;font-weight:800}
.card p{color:var(--dim);margin-top:4px;font-size:15px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 4px}
.stars svg{width:50px;height:50px;fill:var(--off)}
.stars svg:nth-child(2){width:62px;height:62px}
.stars svg.on{fill:var(--gold);animation:star .4s cubic-bezier(.2,1.6,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.14s}
.stars svg.on:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.big{font-size:40px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;color:var(--dim);margin-left:6px}
.card p.rec{min-height:20px}
.card p.cres{margin-top:6px;font-weight:800;font-size:16px;color:var(--gold)}
.card p.cres.lost{color:#FFB4BC}
.news{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.news span{background:rgba(255,197,61,.16);color:var(--gold);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .row{display:flex;gap:8px}
.acts .btn{min-height:48px}
.bit{position:absolute;top:-24px;width:14px;height:14px;animation:fall 1.5s cubic-bezier(.3,.2,.6,1) forwards}
.bit svg{width:100%;height:100%}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}

/* full-screen menus */
.scr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
.top{flex:none;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:24px;font-weight:800;color:var(--gold);letter-spacing:.01em;white-space:nowrap}
.top .sub{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.2}
.total{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;height:44px;padding:0 12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.total svg{width:18px;height:18px;fill:var(--gold)}

#home{justify-content:center;gap:12px}
.hbrand{text-align:center;margin-bottom:4px}
.hbrand h1{font-size:36px;font-weight:800;color:var(--gold);letter-spacing:.01em;line-height:1.1}
.hbrand .sub{color:var(--dim);font-size:13px;margin-top:2px}
.stats{display:flex;gap:10px}
.stat{flex:1;min-width:0;background:var(--panel);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:66px}
.stat svg.fl{width:30px;height:30px;fill:var(--off);flex:none}
.stat.lit svg.fl{fill:var(--fire)}
.stat .tx{min-width:0;flex:1}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat.rk b{font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;font-size:12px;color:var(--dim);margin-top:3px;white-space:nowrap}
.stat small:empty{display:none}
#hJoker{color:var(--gold)}
.pbar{height:6px;border-radius:3px;background:var(--off);margin-top:6px;overflow:hidden}
.pbar u{display:block;height:100%;background:var(--gold);text-decoration:none}
.daily{background:var(--panel);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.daily .tx{flex:1;min-width:0}
.daily b{display:block;font-size:17px}
.daily span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.daily.todo{box-shadow:inset 0 0 0 2px var(--gold)}
.daily.todo span{color:var(--gold)}
.daily .btn{flex:none;width:96px}
#home .btn{flex:none}
#bGo{min-height:58px;font-size:17px}
#home .hrow .btn{flex:1}
.hrow{display:flex;gap:10px}

#wlist{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 0}
.wc{position:relative;min-height:48px;border-radius:16px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;overflow:hidden}
.wc .n{width:36px;height:36px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.wc .n svg{width:18px;height:18px;fill:var(--dim)}
.wc .d{min-width:0;flex:1}
.wc .d span{display:block}
.wc .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .mc{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.15}
.wc .sc{font-size:12px;font-weight:700;margin-top:3px;color:var(--gold);white-space:nowrap}
.wc.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.wc.ok .n{background:#2F7D5B}
.wc[disabled]{background:#182036;cursor:default}
.wc[disabled] .nm,.wc[disabled] .mc,.wc[disabled] .sc{color:#66739A}
.wc:not([disabled]):active{transform:scale(.97)}

#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.cell{position:relative;min-height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.cell .n{font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell .n svg{width:18px;height:18px;fill:#66739A}
.cell .s{display:flex;gap:1px}
.cell .s svg{width:14px;height:14px;fill:var(--off)}
.cell .s svg.on{fill:var(--gold)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.ok{background:#1F4A44}
.cell[disabled]{background:#182036;cursor:default}
.cell:not([disabled]):active{transform:scale(.96)}

#blist{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bd{flex:1;min-height:52px;max-height:76px;border-radius:16px;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 12px}
.bd .ic{width:40px;height:40px;border-radius:50%;background:var(--off);display:flex;align-items:center;justify-content:center;flex:none}
.bd .ic svg{width:22px;height:22px;fill:#66739A}
.bd b{display:block;font-size:15px;color:var(--ink)}
.bd span{display:block;font-size:12px;color:var(--dim);margin-top:1px;line-height:1.2}
.bd.got .ic{background:var(--gold)}
.bd.got .ic svg{fill:var(--gold-ink)}
.bd:not(.got) b{color:#8590B0}

@media (max-height:600px){
  header{padding-top:4px}
  #msg{height:38px}
  footer{padding-bottom:8px}
  .btn{min-height:46px}
  .stars svg{width:40px;height:40px}.stars svg:nth-child(2){width:50px;height:50px}
  .card{padding:14px 16px 12px}.card h2{font-size:22px}
  .big{font-size:34px}
  .acts{gap:6px;margin-top:8px}.acts .btn{min-height:46px}
  .hbrand h1{font-size:30px}
  #home{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="bMap" aria-label="Niveaux">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
    </button>
    <div class="ttl"><span class="brand" id="brand">Pile Poil</span><span id="lvl">Niveau 1</span></div>
    <div class="moves" aria-label="Coups joués"><b id="mv">0</b><small>coups</small></div>
  </header>
  <div id="chal" hidden><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zM8 4h11l-3 4.500 3 4.500H8z"/></svg><span id="chalT"></span></div>
  <div id="goal"></div>
  <main id="board"><div id="stage"></div></main>
  <div id="msg" role="status" aria-live="polite"></div>
  <footer>
    <button class="btn" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"  transform="translate(0 -3)"/></svg>Annuler</button>
    <button class="btn" id="bReset"><svg viewBox="0 0 24 24"><path d="M4 5v6h6M5 11a8 8 0 1 1 2 7"/></svg>Recommencer</button>
  </footer>

  <section class="over" id="win" hidden aria-live="polite">
    <div class="card">
      <h2 id="wTitle">Pile poil !</h2>
      <p id="wSub">Niveau 1 rangé</p>
      <div class="stars" id="wStars"></div>
      <div class="big"><span id="wMoves">0</span><small>coups</small></div>
      <p class="rec" id="wRec"></p>
      <p class="cres" id="wChal" hidden></p>
      <div class="news" id="wNews"></div>
      <div class="acts">
        <button class="btn gold" id="bNext">Suivant</button>
        <div class="row">
          <button class="btn line" id="bAgain">Rejouer</button>
          <button class="btn line" id="bShare">Partager</button>
        </div>
        <button class="btn line" id="bChal">Défier un ami</button>
      </div>
    </div>
  </section>

  <section class="scr" id="home" hidden>
    <div class="hbrand"><h1>Pile Poil</h1><div class="sub">Une couleur par tube, pile poil.</div></div>
    <div class="stats">
      <div class="stat" id="hStreak" aria-label="Série">
        <svg class="fl" viewBox="0 0 24 24"><path d="M12 2c.6 3.600 5.800 6.200 5.800 11.300a5.800 5.800 0 0 1-11.600 0c0-2.100.9-3.600 2-4.800.3 1.500 1.100 2.500 2.100 2.700C9.700 8.600 10.400 4.800 12 2z"/></svg>
        <div class="tx"><b id="hStreakN">0</b><small id="hStreakT">jour de suite</small><small id="hJoker"></small></div>
      </div>
      <div class="stat rk" id="hRank" aria-label="Rang">
        <div class="tx"><b id="hRankN">Fouillis</b><small id="hStars">0 étoile</small><div class="pbar"><u id="hBar"></u></div></div>
      </div>
    </div>
    <div class="daily" id="hDaily">
      <div class="tx"><b>Niveau du jour</b><span id="hDailyT">Pas encore joué</span></div>
      <button class="btn gold" id="bDaily">Jouer</button>
    </div>
    <button class="btn gold" id="bGo">Continuer</button>
    <div class="hrow">
      <button class="btn" id="bWorlds">Mondes</button>
      <button class="btn" id="bBadges">Badges</button>
    </div>
  </section>

  <section class="scr" id="worlds" hidden>
    <div class="top">
      <button class="icon" id="bWBack" aria-label="Accueil"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>Mondes</h1><div class="sub">20 niveaux chacun</div></div>
      <div class="total" aria-label="Étoiles gagnées"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="mTotal">0/600</span></div>
    </div>
    <div id="wlist"></div>
  </section>

  <section class="scr" id="wgrid" hidden>
    <div class="top">
      <button class="icon" id="bGBack" aria-label="Mondes"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1 id="gTitle">Monde 1</h1><div class="sub" id="gSub"></div></div>
      <div class="total" aria-label="Étoiles du monde"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="gTotal">0/60</span></div>
    </div>
    <div id="grid"></div>
    <button class="btn gold" id="bBack" style="flex:none">Reprendre</button>
  </section>

  <section class="scr" id="badges" hidden>
    <div class="top">
      <button class="icon" id="bBBack" aria-label="Accueil"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>Badges</h1><div class="sub" id="bSub"></div></div>
    </div>
    <div id="blist"></div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="star" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>
</defs></svg>

// ---- moves -------------------------------------------------------------------
// The state changes at once; the animation (lift, travel, drop) is cosmetic only.

    { transform: tr(a), easing: 'ease-in-out' },
    { transform: tr(b), easing: 'ease-in' },
    { transform: tr(end), easing: 'ease-out' },
    { transform: tr(up), easing: 'ease-in' },

// ---- starting a level ----------------------------------------------------------
// o = {mode, level, dailyIdx, dayN, free, chal, replay: {hist}}

// ---- streak, jokers, rank, badges ------------------------------------------------
// Run when the game opens (and on a date change). Each missed day uses one joker; if the jokers

        if (i === (w + 1) * PER_WORLD) return true;
      }

      return false;

  BADGES.forEach(function (b) {
    if (hasBadge(b.id) || !(badgeEarned(b.id) || extra === b.id)) return;
    save.badges.push(b.id);

function starsText(s) { var st = ''; while (s--) st += '⭐'; return st; }

  var frag = mode === 'daily' ? 'defi-jour-' + day + '-' + hist.length : 'defi-' + (level + 1) + '-' + hist.length;

function sendText(text, kind, btn, idle) {

    var ok = false;

}
function goDaily() {
  var t = todayNum(), i = dayIndex(t), d = save.daily;
  if (mode === 'daily' && !chal && countDay === t && !won && hist.length) { show('game'); return; }
  startDaily(i, t, d && d.day === t && d.idx === i ? { replay: d } : null);
  show('game');
}
function pickLevel(n) {
  if (mode === 'level' && !chal && n === level + 1 && !won) { show('game'); return; }   // keep the level in progress
  startLevel(n, null);
  show('game');
}
function openGrid() {
  if (mode === 'daily') return show('home');
  renderGrid(worldOf(level));
  show('wgrid');
}

// ---- input: pointer events, with a click fallback for keyboards and assistive tech ----
// A click that belongs to a touch/mouse gesture is never replayed (a long press must not tap twice);
// only clicks without pointer events (keyboard, assistive tech) go through the fallback.
var pressing = false, lastUp = 0;
function stray() { return pressing || Date.now() - lastUp < 700; }
document.addEventListener('pointerdown', function () { pressing = true; }, true);
['pointerup', 'pointercancel'].forEach(function (ev) {
  document.addEventListener(ev, function () { pressing = false; lastUp = Date.now(); }, true);
});
function onTap(el, fn) {
  var down = false;
  el.addEventListener('pointerdown', function () { down = true; });
  el.addEventListener('pointerleave', function () { down = false; });
  el.addEventListener('pointercancel', function () { down = false; });
  el.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false; fn(e);
  });
  el.addEventListener('click', function (e) { if (!stray()) fn(e); });
}
function closestAttr(node, attr) {
  while (node && node !== document.body) {
    if (node.getAttribute && node.getAttribute(attr) !== null) return node;
    node = node.parentNode;
  }
  return null;
}
stage.addEventListener('pointerdown', function (e) {
  var t = closestAttr(e.target, 'data-tube');
  if (!t) return;
  tapTube(+t.getAttribute('data-tube'));
});
stage.addEventListener('click', function (e) {
  var t = closestAttr(e.target, 'data-tube');
  if (t && !stray()) tapTube(+t.getAttribute('data-tube'));
});
onTap($('grid'), function (e) {
  var c = closestAttr(e.target, 'data-level');
  if (c && !c.disabled) pickLevel(+c.getAttribute('data-level'));
});
onTap($('wlist'), function (e) {
  var c = closestAttr(e.target, 'data-world');
  if (c && !c.disabled) { renderGrid(+c.getAttribute('data-world')); show('wgrid'); }
});
onTap($('bUndo'), undo);
onTap($('bReset'), restart);
onTap($('bMap'), openGrid);
onTap($('bBack'), goContinue);
onTap($('bGBack'), function () { show('worlds'); });
onTap($('bWBack'), function () { show('home'); });
onTap($('bBBack'), function () { show('home'); });
onTap($('bGo'), goContinue);
onTap($('bDaily'), goDaily);
onTap($('bWorlds'), function () { show('worlds'); });
onTap($('bBadges'), function () { show('badges'); });
onTap($('bNext'), function () {
  if (mode === 'daily' || free) show('home');
  else if (level + 1 < N) { startLevel(level + 2); show('game'); }
  else show('worlds');
});
onTap($('bAgain'), restart);
onTap($('bShare'), function () { sendText(shareText(), 'result', $('bShare')); });
onTap($('bChal'), function () { sendText(challengeText(), 'challenge', $('bChal')); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
window.addEventListener('resize', function () { if (tubeEls.length) layout(); });
window.addEventListener('hashchange', function () { if (/^#defi-/.test(location.hash)) openChallenge(); });

// ---- boot --------------------------------------------------------------------
loadSave();
syncStreak();
var cg = save.chalGame;   // a challenge in progress is resumed where it was
if (cg && cg.hist && cg.target > 0 && (cg.kind === 'day' ? cg.day > 0 : cg.n >= 1 && cg.n <= N)) {
  if (cg.kind === 'day') startDaily(dayIndex(cg.day), cg.day, { replay: cg, chal: { target: cg.target, level: 0, day: cg.day } });
  else startLevel(cg.n, cg, { free: cg.n > save.max, chal: { target: cg.target, level: cg.n, day: 0 } });
  show('game');
} else {
  save.chalGame = null;
  startLevel(save.level, save.cur && save.cur.level === save.level ? save.cur : null);
  show('home');
}
if (/^#defi-/.test(location.hash)) openChallenge();

// Test hooks. Solutions are never embedded: they live in tools/solutions.json.
window.__game = {
  state: function () {
    var t = todayNum();
    return {
      mode: mode,
      level: mode === 'level' ? level + 1 : 0,
      dailyIndex: dailyIdx,
      tubes: tubes.map(function (x) { return x.slice(); }),
      caps: caps.slice(),
      hidden: hid.slice(),
      moves: hist.length,
      won: won,
      selected: sel,
      stuck: stuck,
      cap: cap,
      mystery: cur.mystery,
      stars: won ? starsFor(hist.length) : 0,
      screen: screen,
      total: totalStars(),
      rank: rankOf(totalStars()) + 1,
      streak: save.streak,
      jokers: save.jokers,
      lastDay: save.lastDay,
      today: t,
      todayIndex: dayIndex(t),
      badges: save.badges.slice(),
      challenge: chal ? { target: chal.target, level: chal.level, day: chal.day } : null
    };
  },
  levels: LV,
  daily: DL,
  loadLevel: function (n) {
    n = n | 0;
    if (n < 1 || n > N) throw new Error('level must be 1..' + N);
    startLevel(n);
    show('game');
    return this.state();
  },
  // i is the zero-based index in `daily`; it counts for the series only if it is today's one.
  loadDaily: function (i) {
    i = i | 0;
    if (i < 0 || i >= ND) throw new Error('daily must be 0..' + (ND - 1));
    startDaily(i, i === dayIndex(todayNum()) ? todayNum() : 0);
    show('game');
    return this.state();
  },
  applyMove: function (from, to) {
    if (won || !tubes[from] || !tubes[to] || !canMove(from, to)) return false;
    dropSel();
    move(from, to, true);
    return true;
  },
  setToday: function (str) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str));
    if (!m) throw new Error('date must be AAAA-MM-JJ');
    simDay = dayOf(+m[1], +m[2], +m[3]);
    syncStreak();
    if (screen === 'home') renderHome();
    return this.state();
  }
};
})();
</script>
