<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1B2D">
<title>Girouette</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F1B2D;--panel:#192A42;--line:#3F5878;--glass:rgba(255,255,255,.05);
  --ink:#F2F5F7;--dim:#A3B5CB;--acc:#34D6BE;--acc-ink:#04211D;--off:#34475F;--warm:#FF9A4D;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;color:var(--ink);
  font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
svg{display:block}

#app{
  position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;flex:none}
.icon{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.icon.sp{background:none}
.icon svg{width:24px;height:24px;fill:var(--ink)}
.icon svg.st{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;text-align:center}
.brand{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvl{display:block;font-size:20px;font-weight:800;white-space:nowrap}

#chal{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:26px;margin:0 12px;border-radius:13px;background:rgba(52,214,190,.16);color:var(--acc);font-size:13px;font-weight:700}
#chal svg{width:14px;height:14px;fill:var(--acc)}
#goal{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:24px;margin:0 14px;font-size:13px;color:var(--dim);white-space:nowrap}
#goal b{color:var(--ink);font-weight:800}
#goal .g{color:var(--acc);font-weight:700}

#list{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:4px 0 0;padding:2px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.row{flex:none;display:flex;align-items:center;gap:6px;min-height:46px;border-radius:14px;background:var(--panel);padding:4px 10px}
.row.empty{background:none;box-shadow:inset 0 0 0 2px var(--off);color:var(--off);font-weight:800;justify-content:center}
.row.hit{background:var(--acc);color:var(--acc-ink)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hit .nm span{color:var(--acc-ink)}
.row .ds{flex:none;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:62px}
.row .ar{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.row .ar svg{width:22px;height:22px;fill:var(--acc)}
.row.hit .ar{background:rgba(4,33,29,.18)}
.row.hit .ar svg{fill:var(--acc-ink)}
.row .pc{flex:none;width:50px;text-align:right}
.row .pc b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pc u{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:3px;overflow:hidden;text-decoration:none}
.row .pc i{display:block;height:100%;background:var(--warm)}
.row .pc i.mid{background:#FFD24D}
.row .pc i.hot{background:var(--acc)}
.row.hit .pc u{background:rgba(4,33,29,.2)}
.row.hit .pc i{background:var(--acc-ink)}
.row.new{animation:in .25s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:0}}

#msg{flex:none;margin:0 14px;min-height:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;color:var(--dim);line-height:1.15}
#msg:empty{display:none}
#msg.warn{color:#FFD9A0}
#comp{flex:none;padding:6px 12px 10px}
#sugg{display:flex;flex-direction:column;overflow-y:auto;margin-bottom:6px;border-radius:14px;background:var(--panel);scrollbar-width:none}
#sugg::-webkit-scrollbar{display:none}
#sugg:empty{display:none}
.sg{flex:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
.sg:last-child{border-bottom:0}
.sg b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sg span{font-size:12px;color:var(--dim);white-space:nowrap;flex:none;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.sg:active{background:rgba(255,255,255,.08)}
.sn{flex:none;min-height:44px;display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--dim)}
#inrow{display:flex;gap:8px}
#inp{flex:1;min-width:0;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
#inp::placeholder{color:#7C8FA8}
#inp:focus{border-color:var(--acc);outline:0}
.btn{
  flex:1;min-height:50px;border-radius:14px;background:var(--panel);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{color:#6B7E97;cursor:default}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.acc[disabled]{background:var(--off);color:#8EA0B8}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--line)}
#bOk{flex:none;width:104px}

.over{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(8,15,27,.92);padding:12px 16px;overflow:hidden;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:330px;background:var(--panel);border-radius:22px;padding:18px 18px 14px;text-align:center;animation:pop .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-size:26px;font-weight:800}
.card p{color:var(--dim);margin-top:4px;font-size:15px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 4px}
.stars svg{width:50px;height:50px;fill:var(--off)}
.stars svg:nth-child(2){width:62px;height:62px}
.stars svg.on{fill:var(--acc);animation:star .4s cubic-bezier(.2,1.6,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.14s}
.stars svg.on:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.big{font-size:40px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;color:var(--dim);margin-left:6px}
.card p.rec{min-height:20px}
.card p.cres{margin-top:6px;font-weight:800;font-size:16px;color:var(--acc)}
.card p.cres.lost{color:#FFB4BC}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .row2{display:flex;gap:8px}
.acts .btn{min-height:48px}
.bit{position:absolute;top:-24px;width:14px;height:14px;animation:fall 1.5s cubic-bezier(.3,.2,.6,1) forwards}
.bit svg{width:100%;height:100%}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}

.scr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
.top{flex:none;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:24px;font-weight:800;color:var(--acc);letter-spacing:.01em;white-space:nowrap}
.top .sub{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.2}
.total{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;height:44px;padding:0 12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.total svg{width:18px;height:18px;fill:var(--acc)}

#home{justify-content:center;gap:14px}
.hbrand{text-align:center}
.hbrand svg{width:104px;height:104px;margin:0 auto 6px}
.hbrand h1{font-size:38px;font-weight:800;color:var(--acc);letter-spacing:.01em;line-height:1.1}
.hbrand .sub{color:var(--dim);font-size:14px;margin-top:4px}
.stat{background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.stat svg{width:30px;height:30px;fill:var(--acc);flex:none}
.stat .tx{flex:1;min-width:0}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.pbar{height:6px;border-radius:3px;background:var(--off);margin-top:8px;overflow:hidden}
.pbar u{display:block;height:100%;background:var(--acc);text-decoration:none}
#home .btn{flex:none}
#bGo{min-height:58px;font-size:17px}

#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.cell{position:relative;min-height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.cell .n{font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell .n svg{width:18px;height:18px;fill:#6B7E97}
.cell .s{display:flex;gap:1px}
.cell .s svg{width:14px;height:14px;fill:var(--off)}
.cell .s svg.on{fill:var(--acc)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.ok{background:#17463F}
.cell[disabled]{background:#14223A;cursor:default}
.cell:not([disabled]):active{transform:scale(.96)}

.tight header{padding:2px 12px 0}
.tight .icon{width:44px;height:44px}
.tight #lvl{font-size:17px}
.tight #goal,.tight .brand{display:none}
.tight #comp{padding-bottom:6px}
.tight #inp{height:46px}.tight .btn{min-height:46px}
.tight .row{min-height:44px}
.tight .row.empty,.sg-on .row.empty{display:none}
@media (max-height:600px){
  header{padding-top:4px}
  .card{padding:14px 16px 12px}.card h2{font-size:22px}
  .stars svg{width:40px;height:40px}.stars svg:nth-child(2){width:50px;height:50px}
  .big{font-size:34px}
  .acts{gap:6px;margin-top:8px}
  .hbrand svg{width:76px;height:76px}.hbrand h1{font-size:32px}
  #home{gap:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

      <button class="btn acc" id="bOk" disabled>Valider</button>
    </div>
  </div>

  <section class="over" id="win" hidden aria-live="polite">

      <p class="rec" id="wRec"></p>
      <p class="cres" id="wChal" hidden></p>
      <div class="acts">

          <button class="btn line" id="bShare">Partager</button>

  <section class="scr" id="home" hidden>

      <h1>Girouette</h1>
      <div class="sub">Trouve la ville d’Afrique, flèche après flèche.</div>
    </div>
    <div class="stat">
      <svg viewBox="0 0 24 24"><use href="#star"/></svg>
      <div class="tx"><b id="hStars">0 / 60</b><small>étoiles</small><div class="pbar"><u id="hBar"></u></div></div>
    </div>
    <button class="btn acc" id="bGo">Continuer</button>
    <button class="btn" id="bLevels">Niveaux</button>
  </section>

  <section class="scr" id="levels" hidden>
    <div class="top">
      <button class="icon" id="bLBack" aria-label="Accueil"><svg class="st" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>Niveaux</h1><div class="sub">1-8 : capitales · 9-20 : villes</div></div>
      <div class="total" aria-label="Étoiles gagnées"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="lTotal">0/60</span></div>
    </div>
    <div id="grid"></div>
    <button class="btn acc" id="bBack" style="flex:none">Reprendre</button>
  </section>
</div>

  var html = '';
  for (var i = 0; i < N; i++) {
    var n = i + 1, s = save.stars[i] || 0, open = n <= save.max, isCur = n === firstOpen();
    html += '<button class="cell' + (isCur ? ' cur' : '') + (s ? ' ok' : '') + '" data-level="' + n + '"' + (open ? '' : ' disabled') +
      ' aria-label="Niveau ' + n + (open ? ', ' + s + ' étoile' + (s > 1 ? 's' : '') : ', verrouillé') + '">' +
      '<span class="n">' + (open ? n : LOCK) + '</span><span class="s">' + starSvg(s >= 1) + starSvg(s >= 2) + starSvg(s >= 3) + '</span></button>';
  }
  $('grid').innerHTML = html;
  $('lTotal').textContent = totalStars() + '/' + (N * 3);
}
function inGame(n) { return !chal && level === n && !over; }
function goContinue() {
  pickLevel(firstOpen());
}
function pickLevel(n) {
  if (inGame(n)) { show('game'); return; }
  startLevel(n);
  show('game');
}

// ---- input events: pointer events, with a click fallback for keyboards and assistive tech ----
var pressing = false, lastUp = 0;
function stray() { return pressing || Date.now() - lastUp < 700; }
document.addEventListener('pointerdown', function () { pressing = true; }, true);
['pointerup', 'pointercancel'].forEach(function (ev) {
  document.addEventListener(ev, function () { pressing = false; lastUp = Date.now(); }, true);
});
function onTap(el, fn) {
  var down = false;
  el.addEventListener('pointerdown', function () { down = true; });
  el.addEventListener('pointerleave', function () { down = false; });
  el.addEventListener('pointercancel', function () { down = false; });
  el.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false; fn(e);
  });
  el.addEventListener('click', function (e) { if (!stray()) fn(e); });
}
function closestAttr(node, attr) {
  while (node && node !== document.body) {
    if (node.getAttribute && node.getAttribute(attr) !== null) return node;
    node = node.parentNode;
  }
  return null;
}
// Tapping a suggestion or the OK button must not take the focus away from the input (the keyboard stays up).
['sugg', 'bOk'].forEach(function (id) {
  $(id).addEventListener('mousedown', function (e) { e.preventDefault(); });
});
onTap($('sugg'), function (e) {
  var c = closestAttr(e.target, 'data-pick');
  if (c) pick(+c.getAttribute('data-pick'));
});
onTap($('bOk'), function () { if (picked >= 0) submitGuess(picked); });
$('inp').addEventListener('input', onInput);
$('inp').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (picked < 0 && sugList.length === 1) pick(sugList[0]);
  if (picked >= 0) submitGuess(picked);
});
onTap($('grid'), function (e) {
  var c = closestAttr(e.target, 'data-level');
  if (c && !c.disabled) pickLevel(+c.getAttribute('data-level'));
});
onTap($('bMap'), function () { renderLevels(); show('levels'); });
onTap($('bBack'), goContinue);
onTap($('bLBack'), function () { show('home'); });
onTap($('bGo'), goContinue);
onTap($('bLevels'), function () { show('levels'); });
onTap($('bNext'), function () {
  if (chal) show('home');
  else if (!found) { begin(level, { fresh: true }); show('game'); }
  else if (level < N) { startLevel(level + 1); show('game'); }
  else show('levels');
});
onTap($('bAgain'), function () { if (found) { begin(level, { fresh: true }); show('game'); } else show('levels'); });
onTap($('bShare'), function () { sendText(shareText(), 'result', $('bShare')); });
onTap($('bChal'), function () { sendText(challengeText(), 'challenge', $('bChal')); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
window.addEventListener('hashchange', function () { if (/^#defi-/.test(location.hash)) openChallenge(); });

// ---- on-screen keyboard: follow the visible viewport, compact the layout ----------------------
function fit() {
  var vv = window.visualViewport, app = $('app');
  if (vv && vv.scale <= 1.01 && (vv.height < window.innerHeight - 2 || vv.offsetTop > 2)) {
    app.style.top = vv.offsetTop + 'px'; app.style.height = vv.height + 'px'; app.style.bottom = 'auto';
  } else { app.style.top = app.style.height = app.style.bottom = ''; }
  document.body.classList.toggle('tight', app.clientHeight < 440);
  $('sugg').style.maxHeight = (maxSugg() * 44) + 'px';
  scrollList();
}
window.addEventListener('resize', fit);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fit);
  window.visualViewport.addEventListener('scroll', fit);
}

// ---- boot ----------------------------------------------------------------------------------------
loadSave();
var cg = save.chalGame;   // a challenge in progress is resumed where it was
if (cg) {
  startLevel(cg.n, cg.guesses, { target: cg.target, level: cg.n });
  show('game');
} else {
  startLevel(firstOpen());
  show('home');
}
fit();
if (/^#defi-/.test(location.hash)) openChallenge();

// Test hooks. The levels expose no answer; the list of cities is public anyway.
window.__game = {
  state: function () {
    return {
      screen: screen,
      level: level,
      attempts: attempts(),
      guesses: guesses.map(function (g) {
        return { name: CITIES[g.i].n, country: CITIES[g.i].c, km: g.km, dir: g.dir, arrow: g.dir < 0 ? '' : ARROWS[g.dir], pct: g.pct, hit: g.hit };
      }),
      found: found, over: over,
      stars: over && found && !chal ? starsFor(attempts()) : 0,
      input: $('inp').value,
      picked: picked >= 0 ? CITIES[picked].n : null,
      suggestions: sugList.map(function (i) { return CITIES[i].n; }),
      total: totalStars(),
      max: save.max,
      continueLevel: firstOpen(),
      challenge: chal ? { target: chal.target, level: chal.level } : null
    };
  },
  levels: TARGETS.map(function (t, i) { return { n: i + 1, kind: CITIES[t].cap ? 'capitale' : 'ville' }; }),
  cities: CITIES.map(function (c) { return { name: c.n, country: c.c, lat: c.lat, lon: c.lon, capital: c.cap }; }),
  loadLevel: function (n) {
    n = n | 0;
    if (n < 1 || n > N) throw new Error('level must be 1..' + N);
    startLevel(n);
    show('game');
    return this.state();
  },
  // Plays a guess by city name, without animation (same code path as the Valider button).
  guess: function (name) {
    var i = cityByKey(norm(name));
    return i >= 0 && submitGuess(i, true);
  },
  seed: function (n) { rngState = n | 0; }
};
})();
</script>
