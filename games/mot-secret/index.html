<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131A2E">
<title>Mot Tapi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#131A2E;--panel:#1D2742;--line:#4A5880;--ink:#F4F1E8;--dim:#A9B4D0;--off:#3A4567;
  --acc:#FF8A5B;--acc-ink:#2B1006;--gold:#FFC53D;--lav:#B9A2FF;--lav-ink:#1B1240;--abs:#2A3453;--abs-ink:#8D9AC0;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;color:var(--ink);
  font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
svg{display:block}

#app{
  position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:8px;padding:6px 12px 2px;flex:none}
.icon{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;text-align:center}
.brand{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
#lvl{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#goal,#chal{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;height:26px;margin:0 12px;font-size:13px;color:var(--dim);white-space:nowrap}
#goal span{display:flex;align-items:center;gap:3px}
#goal svg{width:13px;height:13px;fill:var(--gold)}
#chal{border-radius:13px;background:rgba(255,138,91,.15);color:var(--acc);font-weight:700}
#chal svg{width:14px;height:14px;fill:var(--acc);flex:none}

#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:0 8px;overflow:hidden}
#rows{display:flex;flex-direction:column;gap:var(--gap,5px)}
.row{display:grid;grid-template-columns:repeat(var(--n),var(--t));gap:var(--gap,5px)}
.row.off{opacity:.3}
.row.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.t{
  position:relative;width:var(--t);height:var(--t);border-radius:calc(var(--t)*.2);background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--off);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--t)*.55);line-height:1;padding-top:calc(var(--t)*.06);text-transform:uppercase;color:var(--ink);
}
.t.f{box-shadow:inset 0 0 0 2px var(--ink)}
.t.g{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.t.f.pop{animation:pop .12s}
@keyframes pop{50%{transform:scale(1.1)}}
.t.s0,.t.s1,.t.s2{box-shadow:none;animation:drop .32s var(--d,0s) backwards}
.t.s0{background:var(--abs);color:var(--abs-ink)}
.t.s1{background:var(--lav);color:var(--lav-ink)}
.t.s2{background:var(--acc);color:var(--acc-ink)}
@keyframes drop{from{opacity:0;transform:translateY(-12px) scale(.75)}}
/* shape marks: triangle = right place, diamond = elsewhere, dot = absent */
.t:after,.k:after{content:"";position:absolute;left:8%;top:8%;width:calc(var(--t,40px)*.22);height:calc(var(--t,40px)*.22);background:currentColor}
.t.s2:after,.k.s2:after{clip-path:polygon(50% 0,100% 100%,0 100%)}
.t.s1:after,.k.s1:after{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.t.s0:after,.k.s0:after{border-radius:50%;transform:scale(.45);opacity:.9}
.t:not(.s0):not(.s1):not(.s2):after,.k:not(.s0):not(.s1):not(.s2):after{display:none}

#msg{
  flex:none;height:30px;margin:0 12px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:14px;font-weight:700;color:var(--dim);
}
#msg.warn{color:#FFD9A0}
#kb{flex:none;display:flex;flex-direction:column;gap:5px;padding:2px 4px 8px}
.kr{display:flex;gap:4px;justify-content:center}
.k{
  position:relative;flex:1 1 0;min-width:0;height:46px;border-radius:9px;background:var(--panel);
  font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;
}
.k:active{transform:scale(.94)}
.k.wide{flex:1.6 1 0;font-size:13px}
.k.wide svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.k.go{background:var(--acc);color:var(--acc-ink)}
.k.s0{background:var(--abs);color:var(--abs-ink)}
.k.s1{background:var(--lav);color:var(--lav-ink)}
.k.s2{background:var(--acc);color:var(--acc-ink)}
.k:after{--t:30px;width:7px;height:7px;left:3px;top:3px}

.btn{
  flex:1;min-height:50px;border-radius:14px;background:var(--panel);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--acc);color:var(--acc-ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--line)}

.over{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(12,17,32,.92);padding:12px 16px;overflow:hidden;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:330px;background:var(--panel);border-radius:22px;padding:18px 18px 14px;text-align:center;animation:rise .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-size:26px;font-weight:800}
.card p{color:var(--dim);margin-top:4px;font-size:15px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 4px}
.stars svg{width:50px;height:50px;fill:var(--off)}
.stars svg:nth-child(2){width:62px;height:62px}
.stars svg.on{fill:var(--gold);animation:star .4s cubic-bezier(.2,1.6,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.14s}
.stars svg.on:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.word{display:flex;justify-content:center;gap:4px;margin-top:10px}
.word b{width:34px;height:40px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.card p.rec{min-height:20px}
.card p.cres{margin-top:6px;font-weight:800;font-size:16px;color:var(--acc)}
.card p.cres.lost{color:#FFB4BC}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .row2{display:flex;gap:8px}
.acts .btn{min-height:48px}
.bit{position:absolute;top:-24px;width:14px;height:14px;animation:fall 1.5s cubic-bezier(.3,.2,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}

.scr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
.top{flex:none;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:24px;font-weight:800;color:var(--acc)}
.top .sub{font-size:12px;color:var(--dim);margin-top:2px}
.total{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;height:44px;padding:0 12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.total svg{width:18px;height:18px;fill:var(--gold)}

#home{justify-content:center;gap:14px}
.hbrand{text-align:center}
.hbrand .demo{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.hbrand .demo i{--t:40px;font-style:normal}
.hbrand h1{font-size:38px;font-weight:800;color:var(--acc);line-height:1.1}
.hbrand .sub{color:var(--dim);font-size:14px;margin-top:4px}
.stat{background:var(--panel);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:66px}
.stat svg{width:30px;height:30px;fill:var(--gold);flex:none}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.pbar{height:6px;border-radius:3px;background:var(--off);margin-top:6px;overflow:hidden;width:150px;max-width:100%}
.pbar u{display:block;height:100%;background:var(--gold);text-decoration:none}
#home .btn{flex:none}
#bGo{min-height:58px;font-size:17px}

#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.cell{position:relative;min-height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.cell .n{font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell .n svg{width:18px;height:18px;fill:#66739A}
.cell .s{display:flex;gap:1px}
.cell .s svg{width:14px;height:14px;fill:var(--off)}
.cell .s svg.on{fill:var(--gold)}
.cell small{font-size:10px;color:var(--dim);line-height:1}
.cell.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.ok{background:#1F4A44}
.cell[disabled]{background:#182036;cursor:default}
.cell:not([disabled]):active{transform:scale(.96)}

@media (max-height:600px){
  header{padding-top:2px}
  .stars svg{width:40px;height:40px}.stars svg:nth-child(2){width:50px;height:50px}
  .card{padding:14px 16px 12px}.card h2{font-size:22px}
  .acts{gap:6px;margin-top:8px}.acts .btn{min-height:46px}
  .hbrand h1{font-size:32px}
  #home{gap:10px}
  .hbrand .demo{margin-bottom:8px}
  #msg{height:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<div id="app">
  <header>
    <button class="icon" id="bMap" aria-label="Niveaux">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
    </button>
    <div class="ttl"><span class="brand">Mot Tapi</span><span id="lvl">Niveau 1</span></div>
    <div class="icon" style="background:none" aria-hidden="true"></div>
  </header>
  <div id="chal" hidden><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zM8 4h11l-3 4.500 3 4.500H8z"/></svg><span id="chalT"></span></div>
  <div id="goal"></div>
  <main id="board"><div id="rows"></div></main>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="kb"></div>

  <section class="over" id="win" hidden aria-live="polite">
    <div class="card">
      <h2 id="wTitle">Bravo !</h2>
      <p id="wSub"></p>
      <div class="stars" id="wStars"></div>
      <div class="word" id="wWord"></div>
      <p class="rec" id="wRec"></p>
      <p class="cres" id="wChal" hidden></p>
      <div class="acts">
        <button class="btn gold" id="bNext">Suivant</button>
        <div class="row2">
          <button class="btn line" id="bAgain">Rejouer</button>
          <button class="btn line" id="bShare">Partager</button>
        </div>
        <button class="btn line" id="bChal">Défier un ami</button>
      </div>
    </div>
  </section>

  <section class="scr" id="home" hidden>
    <div class="hbrand">
      <div class="demo" aria-hidden="true"><i class="t s2">M</i><i class="t s1">O</i><i class="t s0">T</i><i class="t s2">S</i></div>

    </div>
    <div class="stat" aria-label="Étoiles">
      <svg viewBox="0 0 24 24"><use href="#star"/></svg>
      <div><b id="hTot">0/60</b><small>étoiles</small><div class="pbar"><u id="hBar"></u></div></div>
    </div>
    <button class="btn gold" id="bGo">Continuer · Niveau 1</button>
    <button class="btn" id="bLevels">Niveaux</button>
  </section>

  <section class="scr" id="levels" hidden>
    <div class="top">
      <button class="icon" id="bLBack" aria-label="Accueil"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h1>Niveaux</h1><div class="sub">4 à 7 lettres</div></div>
      <div class="total" aria-label="Étoiles gagnées"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="lTot">0/60</span></div>
    </div>
    <div id="grid"></div>
    <button class="btn gold" id="bResume" style="flex:none">Reprendre</button>
  </section>
</div>

}
function shareText() {
  return NAME + ' · Niveau ' + (g.lvl + 1) + ' · ' + starsText(starsFor(g.guesses.length)) + '\n' + shapes();
}
// The link base: origin + path of MJ_CONFIG.shareBaseUrl, else of the current address if it is http(s); otherwise no link.
// Never the query string (the host app may carry a token or an id in it).
function shareBase() {
  var raw = window.MJ_CONFIG && window.MJ_CONFIG.shareBaseUrl;
  if (typeof raw !== 'string' || !raw) raw = String(location.href);
  try {
    var u = new URL(raw);
    return /^https?:$/.test(u.protocol) ? u.origin + u.pathname : '';
  } catch (e) { return ''; }
}
// Fragment: letters, digits and hyphens only.
function challengeLink() {
  var base = shareBase();
  return base ? base + '#defi-' + (g.lvl + 1) + '-' + g.guesses.length : '';
}
function challengeText() {
  var link = challengeLink();
  return NAME + ' · Niveau ' + (g.lvl + 1) + ' : trouvé en ' + plural(g.guesses.length, 'essai') + '. Fais aussi bien !' + (link ? ' ' + link : '');
}
function sendText(text, kind, btn) {
  var done = function () { emit({ event: 'share', kind: kind }); };
  var copied = function () { btn.textContent = 'Copié !'; done(); };
  var legacy = function () {   // last resort: hidden textarea + execCommand
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    btn.textContent = ok ? 'Copié !' : 'Copie impossible';
    if (ok) done();
  };
  var clip = function () {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(copied, legacy);
    } catch (e) { /* fall through */ }
    legacy();
  };
  try {
    if (navigator.share) {
      return navigator.share({ text: text }).then(done, function (e) { if (!e || e.name !== 'AbortError') clip(); });
    }
  } catch (e) { /* fall through */ }
  clip();
}

// ---- challenges (#defi-<level>-<tries>) -------------------------------------------
// Opening one never touches the progress or the game in progress: it lives in its own save slot.
function openChallenge() {
  var h = String(location.hash || ''), m;
  try { if (h) history.replaceState(null, '', String(location.href).split('#')[0]); } catch (e) { /* ignore */ }
  m = /^#defi-(\d{1,2})-(\d{1})$/.exec(h);
  if (!m) return false;
  var n = +m[1], target = +m[2];
  if (n < 1 || n > N || target < 1 || target > MAXTRY) return false;
  startGame(n - 1, null, target);
  emit({ event: 'challenge_open', level: n, target: target });
  show('game');
  return true;
}

// ---- screens -------------------------------------------------------------------
var SCREENS = ['home', 'levels'];
function show(name) {
  clearTimeout(winTimer);
  screen = name;
  SCREENS.forEach(function (s) { $(s).hidden = s !== name; });
  if (name !== 'game') $('win').hidden = true;
  if (name === 'home') renderHome();
  else if (name === 'levels') renderLevels();
  else if (name === 'game') layout();
}
function renderHome() {
  var t = totalStars();
  $('hTot').textContent = t + '/' + (N * 3);
  $('hBar').style.width = Math.round(t * 100 / (N * 3)) + '%';
  $('bGo').textContent = 'Continuer · Niveau ' + firstOpen();
}
var LOCK = '<svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1.500v10h-13V10zm2.500 0h5V8a2.500 2.500 0 0 0-5 0z"/></svg>';
function renderLevels() {
  $('lTot').textContent = totalStars() + '/' + (N * 3);
  var h = '';
  for (var i = 0; i < N; i++) {
    var n = i + 1, locked = n > save.max, s = save.stars[i];
    h += '<button class="cell' + (s ? ' ok' : '') + (n === firstOpen() ? ' cur' : '') + '" data-level="' + n + '"' + (locked ? ' disabled' : '') +
      ' aria-label="Niveau ' + n + (locked ? ', verrouillé' : ', ' + s + ' étoile' + (s > 1 ? 's' : '')) + '">' +
      '<span class="n">' + (locked ? LOCK : n) + '</span><span class="s">' +
      '<svg viewBox="0 0 24 24" class="' + (s > 0 ? 'on' : '') + '"><use href="#star"/></svg>' +
      '<svg viewBox="0 0 24 24" class="' + (s > 1 ? 'on' : '') + '"><use href="#star"/></svg>' +
      '<svg viewBox="0 0 24 24" class="' + (s > 2 ? 'on' : '') + '"><use href="#star"/></svg></span></button>';
  }
  $('grid').innerHTML = h;
}
// "Continuer" always points at the first level not yet finished (replaying an old level does not move it).
function firstOpen() {
  for (var i = 0; i < N; i++) if (!save.stars[i]) return Math.min(i + 1, save.max);
  return N;
}
// Back to the normal run (leaves a challenge without saving it).
function startNormal(n) {
  var r = save.cur && save.cur.level === n ? save.cur : null;
  startGame(n - 1, r, 0);
}
function playLevel(n) {
  save.chal = null;
  if (save.cur && save.cur.level !== n) save.cur = null;
  store();
  startNormal(n);
  show('game');
}
function goContinue() { playLevel(firstOpen()); }
// After a loss or a win: a fresh game of the same level (never offered in the middle of a game).
function again() {
  if (!g || !g.over || g.target) return;
  save.cur = null;
  store();
  startGame(g.lvl, null, 0);
  if (screen !== 'game') show('game');
}

// ---- events --------------------------------------------------------------------
var ptrAt = 0;   // time of the last pointer activation: the click that follows it is not a second tap
function onTap(el, fn) {
  var down = false;
  el.addEventListener('pointerdown', function () { down = true; });
  el.addEventListener('pointerleave', function () { down = false; });
  el.addEventListener('pointercancel', function () { down = false; });
  el.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false; ptrAt = Date.now(); fn(e);
  });
  // keyboard / assistive activation (no pointer): click without a pointer tap just before
  el.addEventListener('click', function (e) { if (ptrAt) { ptrAt = 0; return; } fn(e); });
}
function closestAttr(node, attr) {
  while (node && node !== document.body) {
    if (node.getAttribute && node.getAttribute(attr) !== null) return node;
    node = node.parentNode;
  }
  return null;
}
// the keyboard reacts on press (fast typing); the click that follows a press is ignored
$('kb').addEventListener('pointerdown', function (e) {
  var k = closestAttr(e.target, 'data-k');
  if (!k) return;
  ptrAt = Date.now();
  press(k.getAttribute('data-k'));
});
$('kb').addEventListener('click', function (e) {
  var k = closestAttr(e.target, 'data-k');
  if (!k) return;
  if (ptrAt) { ptrAt = 0; return; }
  press(k.getAttribute('data-k'));
});
function press(c) {
  if (c === 'ENTER') submit(); else if (c === 'BACK') backspace(); else typeLetter(c);
}
document.addEventListener('keydown', function (e) {
  if (screen !== 'game' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { if (e.target && e.target.tagName === 'BUTTON') return; submit(); }
  else if (e.key === 'Backspace') backspace();
  else if (/^[a-zA-Z]$/.test(e.key)) typeLetter(e.key.toUpperCase());
});
onTap($('grid'), function (e) {
  var c = closestAttr(e.target, 'data-level');
  if (c && !c.disabled) playLevel(+c.getAttribute('data-level'));
});
onTap($('bMap'), function () { leaveToLevels(); });
onTap($('bGo'), goContinue);
onTap($('bLevels'), function () { show('levels'); });
onTap($('bLBack'), function () { show('home'); });
onTap($('bResume'), goContinue);
function leaveToLevels() {
  if (g && g.target) { save.chal = null; store(); startNormal(firstOpen()); }
  show('levels');
}
onTap($('bNext'), function () {
  if (g.target) {   // challenge over: back to the normal run
    startNormal(firstOpen()); show('home');
  } else if (g.won && g.lvl + 1 < N) { playLevel(g.lvl + 2); }
  else show('levels');
});
onTap($('bAgain'), again);
onTap($('bShare'), function () { sendText(shareText(), 'result', $('bShare')); });
onTap($('bChal'), function () { sendText(challengeText(), 'challenge', $('bChal')); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
window.addEventListener('resize', layout);
window.addEventListener('hashchange', function () { if (/^#defi-/.test(location.hash)) openChallenge(); });

// ---- boot ------------------------------------------------------------------------
buildKeys();
loadSave();
if (save.chal) {   // a challenge in progress is resumed where it was
  startGame(save.chal.level - 1, save.chal, save.chal.target);
  show('game');
} else {
  save.chal = null;
  startNormal(firstOpen());
  show('home');
}
if (/^#defi-/.test(location.hash)) openChallenge();

// ---- test hooks. The answers are never exposed here. -------------------------------
window.__game = {
  state: function () {
    var marks = g.guesses.map(function (x) { return evalGuess(x, g.word).join(''); });
    return {
      screen: screen,
      level: g.lvl + 1,
      len: g.len,
      first: g.first,
      guesses: g.guesses.slice(),
      marks: marks,
      typed: g.typed,
      tries: g.guesses.length,
      limit: limit(),
      over: g.over,
      won: g.won,
      stars: g.stars,
      keys: keyStates(),
      msg: lastMsg,
      challenge: g.target ? { level: g.lvl + 1, target: g.target } : null,
      save: { level: firstOpen(), max: save.max, stars: save.stars.slice(), best: save.best.slice() },
      total: totalStars()
    };
  },
  levels: LEVELS,
  loadLevel: function (n) {
    n = n | 0;
    if (n < 1 || n > N) throw new Error('level must be 1..' + N);
    playLevel(n);
    return this.state();
  },
  seed: function (n) { seedV = n | 0; },
  // Plays without animation: replaces what is typed by `word` (first letter included), then submits.
  play: function (word) {
    word = String(word).toUpperCase();
    g.typed = g.first;
    for (var i = 1; i < word.length && g.typed.length < g.len; i++) typeLetter(word.charAt(i));
    submit();
    return this.state();
  }
};
})();
</script>
