<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1B1C">
<title>Carton Plein</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0E1B1C;--panel:#183033;--line:#4C6D70;--ink:#F3F5EC;--dim:#A6BEBC;--acc:#A3E04D;--acc-ink:#1A2A06;
  --off:#2F4A4D;--warn:#FFB347;--bad:#FF7A7A;--bad-bg:#4A2328;--ok-bg:#33541C;
}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;top:0;right:0;bottom:0;left:0;color:var(--ink);
  font:16px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
svg{display:block}
#app{position:absolute;top:0;right:0;bottom:0;left:0}

.scr{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px)}
.icon{width:48px;height:48px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn{
  flex:1;min-height:50px;border-radius:14px;background:var(--panel);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;
}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{color:#6F8D8B;box-shadow:inset 0 0 0 2px var(--off);cursor:default}
.btn[disabled]:active{transform:none}

/* home */
#home{justify-content:center;gap:12px}
.hero{text-align:center}
.hero svg{width:128px;height:128px;margin:0 auto 6px}
.hero h1{font-size:38px;font-weight:800;color:var(--acc);letter-spacing:.01em;line-height:1.1}
.hero .sub{color:var(--dim);font-size:14px;margin-top:4px}
.total{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border-radius:16px;min-height:52px;padding:0 14px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.total svg{width:22px;height:22px;fill:var(--acc)}
.total small{font-size:13px;font-weight:600;color:var(--dim)}
#bGo{flex:none;min-height:58px;font-size:17px}
#bLevels{flex:none}

/* level grid */
.top{flex:none;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0}
.top h2{font-size:24px;font-weight:800;color:var(--acc);white-space:nowrap}
.top .sub{font-size:12px;color:var(--dim);margin-top:2px}
.top .total{min-height:44px;height:44px;border-radius:14px;font-size:16px;flex:none}
#cells{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 0}
.cell{position:relative;min-height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden}
.cell .n{font-weight:800;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.cell .n svg{width:18px;height:18px;fill:#6F8D8B}
.cell .s{display:flex;gap:1px}
.cell .s svg{width:14px;height:14px;fill:var(--off)}
.cell .s svg.on{fill:var(--acc)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.ok{background:#2E4A22}
.cell[disabled]{background:#13262A;cursor:default}
.cell:not([disabled]):active{transform:scale(.96)}

/* game */
#game{padding-left:calc(env(safe-area-inset-left) + 12px);padding-right:calc(env(safe-area-inset-right) + 12px)}
.gh{flex:none;display:flex;align-items:center;gap:8px}
.gh .ttl{flex:1;min-width:0;text-align:center}
.brand{display:block;font-size:12px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvl{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{width:60px;height:48px;border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.pts b{font-size:18px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.pts small{font-size:10px;color:var(--dim);margin-top:2px}
#chal{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:26px;margin-top:6px;border-radius:13px;background:rgba(163,224,77,.15);color:var(--acc);font-size:13px;font-weight:700}
#chal svg{width:14px;height:14px;fill:var(--acc)}
.mrow{flex:none;display:flex;align-items:center;gap:10px;margin-top:8px}
#pips{flex:1;display:flex;gap:6px}
.pip{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--off);flex:none}
.pip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.pip.ok{background:var(--acc);color:var(--acc-ink)}
.pip.ko{background:var(--warn);color:#3A2100;border-radius:7px}
.pip.cur{background:none;box-shadow:inset 0 0 0 3px var(--ink)}
#secs{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
#secs.low{color:var(--warn)}
.bar{flex:none;height:8px;border-radius:4px;background:var(--off);margin-top:6px;overflow:hidden}
.bar u{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;text-decoration:none}
.bar.low u{background:var(--warn)}
#qwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 4px}
#q{font-size:20px;font-weight:700;line-height:1.25;text-align:center;overflow:hidden}
#ans{flex:none;display:flex;flex-direction:column;gap:8px}
.a{min-height:52px;border-radius:14px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:6px 10px;text-align:left;font-size:16px;font-weight:600;line-height:1.15;box-shadow:inset 0 0 0 2px transparent}
.a:active{transform:scale(.98)}
.a .l{width:30px;height:30px;border-radius:9px;background:var(--off);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.a .t{flex:1;min-width:0}
.a .m{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;display:none}
.a.right{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--acc)}
.a.right .l{background:var(--acc);color:var(--acc-ink)}
.a.right .m{display:block;color:var(--acc)}
.a.wrong{background:var(--bad-bg);box-shadow:inset 0 0 0 2px var(--bad)}
.a.wrong .m{display:block;color:var(--bad)}
.a.dim{opacity:.55}
.a.shake{animation:no .28s}
@keyframes no{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#foot{flex:none;height:60px;margin-top:8px;display:flex;align-items:center;gap:10px}
#goal{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--dim);line-height:1.2}
#goal b{color:var(--acc);font-weight:800}
#fb{flex:1;min-width:0;line-height:1.2}
#fb b{display:block;font-size:16px}
#fb span{display:block;font-size:13px;color:var(--dim);margin-top:2px}
#fb.good b{color:var(--acc)}
#fb.bad b{color:var(--warn)}
#bNext{flex:none;width:138px}

/* result */
.over{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(7,16,17,.92);padding:12px 16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{width:100%;max-width:330px;background:var(--panel);border-radius:22px;padding:18px 18px 14px;text-align:center;animation:pop .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}}
.card h2{font-size:26px;font-weight:800}
.card p{color:var(--dim);margin-top:4px;font-size:15px}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 4px}
.stars svg{width:50px;height:50px;fill:var(--off)}
.stars svg:nth-child(2){width:62px;height:62px}
.stars svg.on{fill:var(--acc);animation:star .4s cubic-bezier(.2,1.6,.4,1) backwards}
.stars svg.on:nth-child(2){animation-delay:.14s}
.stars svg.on:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.big{font-size:40px;font-weight:800;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:600;color:var(--dim);margin-left:6px}
#rPips{display:flex;justify-content:center;gap:6px;margin-top:10px}
.card p.rec{min-height:20px}
.card p.cres{margin-top:6px;font-weight:800;font-size:16px;color:var(--acc)}
.card p.cres.lost{color:var(--warn)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts .row{display:flex;gap:8px}
.acts .btn{min-height:48px}

@media (max-height:600px){
  .scr{padding-top:calc(env(safe-area-inset-top) + 4px)}
  .hero h1{font-size:32px}
  #home{gap:9px}
  #q{font-size:18px}
  .a{min-height:50px;font-size:15px;padding-top:4px;padding-bottom:4px}
  .a .l{width:28px;height:28px}
  #ans{gap:6px}
  #foot{height:56px;margin-top:6px}
  .stars svg{width:40px;height:40px}.stars svg:nth-child(2){width:50px;height:50px}
  .card{padding:14px 16px 12px}.card h2{font-size:22px}
  .big{font-size:34px}
  .acts{gap:6px;margin-top:8px}.acts .btn{min-height:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <section class="scr" id="home">
    <div class="hero">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g transform="rotate(-16 60 60)"><rect x="22" y="14" width="46" height="64" rx="8" fill="#FFC53D"/></g>
        <g transform="rotate(14 60 60)"><rect x="52" y="14" width="46" height="64" rx="8" fill="#FF6B6B"/></g>
        <circle cx="60" cy="72" r="34" fill="#F3F5EC"/>
        <path d="M60 61l10.500 7.600-4 12.400H53.500l-4-12.400z" fill="#0E1B1C"/>
        <path d="M60 61V44M70.500 68.600l16.100-5.300M66.500 81l10 13.700M53.500 81l-10 13.700M49.500 68.600l-16.100-5.300" stroke="#0E1B1C" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
      <h1>Carton Plein</h1>
      <div class="sub">5 questions, 12 secondes, tout le foot.</div>
    </div>
    <div class="total" aria-label="Étoiles obtenues"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="hTotal">0</span><small>sur 60</small></div>
    <button class="btn acc" id="bGo">Continuer · Niveau 1</button>
    <button class="btn" id="bLevels">Tous les niveaux</button>
  </section>

  <section class="scr" id="grid" hidden>
    <div class="top">
      <button class="icon" id="bGBack" aria-label="Accueil"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h2>Niveaux</h2><div class="sub">20 niveaux</div></div>
      <div class="total" aria-label="Étoiles obtenues"><svg viewBox="0 0 24 24"><use href="#star"/></svg><span id="gTotal">0/60</span></div>
    </div>
    <div id="cells"></div>
  </section>

  <section class="scr" id="game" hidden>
    <div class="gh">
      <button class="icon" id="bMap" aria-label="Niveaux"><svg viewBox="0 0 24 24" style="fill:var(--ink);stroke:none"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
      <div class="ttl"><span class="brand" id="theme">Carton Plein</span><span id="lvl">Niveau 1</span></div>
      <div class="pts" aria-label="Points"><b id="pts">0</b><small>pts</small></div>
    </div>
    <div id="chal" hidden><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zM8 4h11l-3 4.500 3 4.500H8z"/></svg><span id="chalT"></span></div>
    <div class="mrow"><div id="pips"></div><div id="secs" aria-label="Secondes restantes">12</div></div>
    <div class="bar" id="bar"><u id="barU"></u></div>
    <div id="qwrap"><div id="q" role="heading" aria-level="2"></div></div>
    <div id="ans"></div>
    <div id="foot">
      <div id="goal"></div>
      <div id="fb" hidden role="status" aria-live="polite"><b id="fbT"></b><span id="fbS"></span></div>
      <button class="btn acc" id="bNext" hidden>Suivante</button>
    </div>
  </section>

  <section class="over" id="res" hidden aria-live="polite">
    <div class="card">
      <h2 id="rTitle">Bravo !</h2>
      <p id="rSub"></p>
      <div class="stars" id="rStars"></div>
      <div class="big"><span id="rScore">0</span><small>points</small></div>
      <div id="rPips"></div>
      <p class="rec" id="rRec"></p>
      <p class="cres" id="rChal" hidden></p>
      <div class="acts">
        <button class="btn acc" id="bRNext">Suivant</button>
        <div class="row">
          <button class="btn line" id="bAgain">Rejouer</button>
          <button class="btn line" id="bShare">Partager</button>
          <button class="btn line" id="bHome" hidden>Accueil</button>
        </div>
        <button class="btn line" id="bChal">Défier un ami</button>
      </div>
    </div>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="star" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.400l6.600-.9z"/>
</defs></svg>

  seed: function (n) { save.seed = int(n, 1, 1e9) || 1; save.att = 0; store(); return save.seed; },
  freeze: function (b) {
    if (b !== false) { if (frozenAt === null) frozenAt = now(); }
    else if (frozenAt !== null) { skew = frozenAt - Date.now(); frozenAt = null; }
  },
  advance: function (ms) {   // moves the game clock forward, as if that time had passed
    ms = Math.max(0, +ms || 0);
    if (frozenAt !== null) frozenAt += ms; else skew += ms;
    checkExpiry();
    if (G && screen === 'game' && !G.fin && G.sel === null) renderTimer();
  }
};
})();
</script>
